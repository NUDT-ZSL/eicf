[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eicf-audit"
version = "1.0.0"
description = "eICF 多站点增量采集与审计快照服务（仅标准库）"
requires-python = ">=3.11"

[project.scripts]
eicf = "eicf.cli:main"

[tool.setuptools]
packages = ["eicf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

